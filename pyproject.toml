[project]
name = "ai-kiosk"
version = "0.1.0"
description = "AI Kiosk — 100% offline voice kiosk (Vosk STT / Piper TTS / Tkinter)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Volodymyr Shevchenko", email = "admin@fayna.agency" }]
maintainers = [{ name = "Fayna Digital", email = "admin@fayna.agency" }]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pre-commit>=3.7",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
